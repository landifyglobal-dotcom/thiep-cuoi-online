<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14512F">
<title>Thiệp mời — Hoàng Phi &amp; Kiều My</title>
<meta name="description" id="metaDesc" content="Trân trọng kính mời quý khách đến chung vui cùng gia đình trong Lễ Tân Hôn của Hoàng Phi & Kiều My.">
<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="Thiệp mời — Hoàng Phi & Kiều My">
<meta property="og:description" id="ogDesc" content="Trân trọng kính mời quý khách đến chung vui cùng gia đình trong Lễ Tân Hôn của Hoàng Phi & Kiều My.">
<meta property="og:url" id="ogUrl" content="https://nhatrai.hoangphi-kieumy.site/">
<meta property="og:image" content="https://storage.hoangphi-kieumy.site/anh/og/thumb.jpg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="1200">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" id="twTitle" content="Thiệp mời — Hoàng Phi & Kiều My">
<meta name="twitter:description" id="twDesc" content="Trân trọng kính mời quý khách đến chung vui cùng gia đình trong Lễ Tân Hôn của Hoàng Phi & Kiều My.">
<meta name="twitter:image" content="https://storage.hoangphi-kieumy.site/anh/og/thumb.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Be+Vietnam+Pro:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14512F; --ink-deep:#0C3A20; --leaf:#89A879;
  --mint:#E7EFE3; --mint-2:#D8E6D2; --paper:#FCFBF5;
  --soft:rgba(20,81,47,.8); --line:rgba(20,81,47,.2); --hair:rgba(20,81,47,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--mint);color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,sans-serif;font-weight:400;line-height:1.6;
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.serif{font-family:"EB Garamond",serif}
.script{font-family:"Dancing Script",cursive}

.sheet{position:relative;width:100%;max-width:470px;min-height:100vh;
  background:linear-gradient(rgba(252,251,245,.95),rgba(252,251,245,.95)),
             url('https://storage.hoangphi-kieumy.site/hoa/flower.webp');
  background-repeat:no-repeat,repeat;background-size:cover,520px 520px;
  background-position:0 0,center 0;
  box-shadow:0 24px 60px -26px rgba(12,58,32,.45);overflow:hidden}

/* hoa watercolor — một ảnh, xoay/lật lại để dùng ở nhiều góc */
.floral{position:absolute;pointer-events:none;z-index:0;
  background-image:url('https://storage.hoangphi-kieumy.site/hoa/flower.webp');background-size:contain;background-repeat:no-repeat}
.floral.br{bottom:-20px;right:-40px;width:56%;max-width:210px;aspect-ratio:1/1;
  opacity:.9;transform:rotate(178deg)}

/* ═══ bìa — mở sang hai bên ═══ */
#cover{--cv-fg:var(--paper);--cv-soft:rgba(252,251,245,.68);--cv-line:rgba(252,251,245,.24);
  position:fixed;inset:0;z-index:80;border:0;width:100%;max-width:none;overflow:hidden;color:var(--cv-fg)}
#cover .cv-panel{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;
  transition:transform 1s cubic-bezier(.65,0,.35,1)}
#cover .cv-panel.l{left:0;border-right:1px solid var(--cv-line);
  background:radial-gradient(150% 100% at 100% 50%,var(--ink) 0%,var(--ink-deep) 85%)}
#cover .cv-panel.r{right:0;border-left:1px solid var(--cv-line);
  background:radial-gradient(150% 100% at 0% 50%,var(--ink) 0%,var(--ink-deep) 85%)}
#cover .cv-panel svg{position:absolute;top:50%;width:130px;opacity:.5}
#cover .cv-panel.l svg{right:-14px;transform:translateY(-50%)}
#cover .cv-panel.r svg{left:-14px;transform:translateY(-50%) scaleX(-1)}

/* lá rơi */
#cover .leaves{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;
  transition:opacity .5s ease}
#cover .leaf{position:absolute;top:-30px;color:var(--leaf);opacity:0;
  animation:leaf-fall linear infinite}
#cover .leaf svg{width:1em;height:1em;display:block}
@keyframes leaf-fall{
  0%{transform:translate(0,-30px) rotate(0deg);opacity:0}
  8%{opacity:.6}
  92%{opacity:.5}
  100%{transform:translate(var(--sway,20px),112vh) rotate(340deg);opacity:0}
}
#cover.open .leaves{opacity:0}

#cover .cv-face{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;padding:36px 26px;text-align:center;
  transition:opacity .5s ease .12s,transform .5s ease .12s}
#cover .cv-lead{margin-top:14px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--cv-soft)}
#cover .cv-names{font-family:"Dancing Script",cursive;font-weight:600;color:var(--cv-fg);
  font-size:clamp(34px,10vw,46px);line-height:1.22;margin:12px 0 4px}
#cover .cv-amp{font-family:"EB Garamond",serif;font-style:italic;font-size:19px;color:var(--leaf);display:block}
#cover .cv-date{font-family:"EB Garamond",serif;font-size:16px;letter-spacing:.1em;color:var(--cv-fg)}

/* dấu ấn chính giữa */
#cover .cv-seal{position:relative;width:86px;height:86px;margin:22px 0 4px;flex:none;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  border:1px solid var(--cv-fg);animation:glow 2.8s ease-in-out infinite}
#cover .cv-seal::before{content:"";position:absolute;inset:6px;border:1px solid var(--cv-line);border-radius:50%}
#cover .cv-seal b{font-family:"Dancing Script",cursive;font-weight:600;font-size:25px;color:var(--cv-fg)}
#cover .cv-seal .amp{font-family:"EB Garamond",serif;font-style:italic;font-size:13px;color:var(--leaf);margin:0 1px}

#cover .cv-guest{font-family:"EB Garamond",serif;font-style:italic;font-size:18px;margin-top:4px;min-height:24px;color:var(--cv-fg)}

/* nút mở thiệp — pill sáng chạy qua */
#cover .cv-cta{position:relative;display:inline-flex;align-items:center;justify-content:center;
  margin-top:18px;padding:12px 34px;border-radius:999px;overflow:hidden;
  background:var(--cv-fg);color:var(--ink-deep);font-family:"EB Garamond",serif;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  box-shadow:0 12px 26px -12px rgba(0,0,0,.55)}
#cover .cv-cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.6),transparent);
  animation:cta-shine 3s ease-in-out infinite}
@keyframes cta-shine{0%,20%{left:-60%}70%,100%{left:120%}}
#cover .cv-cue{margin-top:12px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cv-soft)}
@keyframes glow{50%{opacity:.5}}

#cover.open .cv-panel.l{transform:translateX(-100%)}
#cover.open .cv-panel.r{transform:translateX(100%)}
#cover.open .cv-face{opacity:0;transform:scale(.92)}
#cover.open{pointer-events:none}

/* ═══ khối chung ═══ */
.sec{position:relative;z-index:1;padding:40px 26px;text-align:center}
.sec+.sec{border-top:1px solid var(--hair)}
.hd{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--leaf);margin-bottom:18px;font-weight:500}
.orn{display:flex;align-items:center;gap:12px;margin:18px 0}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.orn b{font-size:12px;color:var(--leaf);font-weight:400}
.rv{opacity:0;transform:translateY(18px);transition:opacity .85s ease,transform .85s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}
/* chữ/số liệu trong section xuất hiện lệch nhịp so với khối bao ngoài */
.rv .hd,.rv .story-hd{opacity:0;transform:translateY(12px);
  transition:opacity .7s ease .12s,transform .7s cubic-bezier(.2,.7,.3,1) .12s}
.rv.in .hd,.rv.in .story-hd{opacity:1;transform:none}
.rv .big,.rv .venue-name,.rv .thanks{opacity:0;transform:translateY(12px) scale(.97);
  transition:opacity .75s ease .2s,transform .75s cubic-bezier(.2,.7,.3,1) .2s}
.rv.in .big,.rv.in .venue-name,.rv.in .thanks{opacity:1;transform:none}

/* ═══ 1 câu chuyện tình yêu ═══ */
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:var(--mint-2);color:var(--leaf);font-size:10px;letter-spacing:.18em;text-align:center;padding:6px}
.story{position:relative;overflow:hidden;text-align:center;
  padding-top:48px;padding-bottom:40px}
.story .floral.tr{top:-10px;right:-30px;width:140px;height:140px;opacity:.95}
.story .floral.bl{bottom:-10px;left:-30px;width:140px;height:140px;
  opacity:.95;transform:rotate(178deg)}
.story .orn,.story .hd,.story .big,.story .lunar{position:relative;z-index:2}
.story-hd{position:relative;z-index:2;font-family:"EB Garamond",serif;font-size:12.5px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink);margin-bottom:30px}
.story-hd i{font-style:italic;letter-spacing:.1em}

.duo{position:relative;z-index:2;margin-bottom:26px}
.duo .row{display:flex;align-items:center;gap:14px}
.duo .row.rev{flex-direction:row-reverse;text-align:right}
.duo-band{position:relative;z-index:1;left:-26px;width:calc(100% + 52px);height:56px;margin:-40px 0;
  background:url('https://storage.hoangphi-kieumy.site/hoa/decoration_bar.webp') center/cover}
.ply{position:relative;z-index:2;width:64%;max-width:230px;flex:none;background:#fff;padding:10px;
  box-shadow:0 20px 36px -18px rgba(12,58,32,.45)}
@keyframes photoInL{from{opacity:0;transform:translateY(26px) rotate(-8deg) scale(.94)}
  to{opacity:1;transform:translateY(0) rotate(-8deg) scale(1)}}
@keyframes photoInR{from{opacity:0;transform:translateY(26px) rotate(8deg) scale(.94)}
  to{opacity:1;transform:translateY(0) rotate(8deg) scale(1)}}
.duo .row:not(.rev) .ply{animation:photoInL .9s cubic-bezier(.2,.7,.3,1) .3s both}
.duo .row.rev .ply{animation:photoInR .9s cubic-bezier(.2,.7,.3,1) .6s both}
.ply-photo{aspect-ratio:3/4;overflow:hidden;background:var(--mint-2);border:1.5px solid #B9A26A}
.ply-photo img{width:100%;height:100%;object-fit:cover;display:block}
.duo-info{flex:1;min-width:0}
.duo-info small{display:block;font-family:"EB Garamond",serif;font-style:italic;
  font-size:12.5px;letter-spacing:.04em;color:var(--soft);line-height:1.6}
.duo-info b{display:block;font-family:"EB Garamond",serif;font-weight:600;
  font-size:32px;color:var(--ink);margin-top:6px;line-height:1.15}

/* ═══ 2 thông tin lễ cưới ═══ */
.fams{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start;margin-bottom:22px}
.fams .vr{width:1px;background:var(--line);align-self:stretch}
.fam small{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);margin-bottom:8px;font-weight:500}
.fam p{font-family:"EB Garamond",serif;font-weight:600;font-size:14px;line-height:1.55;letter-spacing:.02em}
.fam em{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:var(--soft);
  font-family:"Be Vietnam Pro",sans-serif;margin-top:7px;line-height:1.55}
.tell{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);line-height:1.8}
.big{font-family:"Dancing Script",cursive;font-weight:600;font-size:clamp(30px,8.4vw,38px);line-height:1.3;margin:6px 0}
.role{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.venue-line{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:20px}
.venue-name{font-family:"EB Garamond",serif;font-size:22px;font-weight:600;letter-spacing:.04em;margin-top:4px}

/* ═══ khối ngày giờ ═══ */
.dt{display:inline-block;margin-top:16px}
.dt .hour{font-family:"EB Garamond",serif;font-size:42px;line-height:1;color:var(--ink)}
.dt .row{display:flex;align-items:center;justify-content:center;gap:0;margin-top:12px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dt .row div{padding:9px 14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.dt .row div.d{font-family:"EB Garamond",serif;font-size:34px;letter-spacing:0;color:var(--ink);
  border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 16px}
.dt .yr{font-family:"EB Garamond",serif;font-size:17px;margin-top:8px;letter-spacing:.1em}
.lunar{font-size:12px;font-style:italic;color:var(--soft);margin-top:6px}

/* ═══ 3 album ═══ */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal button{padding:0;border:0;background:var(--mint-2);aspect-ratio:3/4;overflow:hidden;position:relative;
  border-radius:12px;opacity:0;transform:translateY(16px) scale(.92);
  transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.3,1)}
.gal button.in{opacity:1;transform:none}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.gal button:hover img{transform:scale(1.05)}
.gal .more{position:absolute;inset:0;background:rgba(12,58,32,.6);color:var(--paper);
  display:flex;align-items:center;justify-content:center;font-family:"EB Garamond",serif;font-size:26px}

#lb{position:fixed;inset:0;z-index:90;background:rgba(9,34,19,.96);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#lb.on{display:flex}
#lb .stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;
  color:#fff;font-size:34px;padding:14px;opacity:.75;touch-action:manipulation}
#lb .nav.p{left:2px} #lb .nav.n{right:2px}
#lb .x{position:absolute;top:12px;right:14px;background:none;border:0;color:#fff;font-size:26px}
#lb .cnt{color:rgba(255,255,255,.7);font-size:12px;letter-spacing:.14em}
#lb .thumbs{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:4px}
#lb .thumbs img{width:52px;height:52px;object-fit:cover;opacity:.42;flex:none;cursor:pointer}
#lb .thumbs img.on{opacity:1;outline:1px solid #fff}

/* ═══ 4 tiệc ═══ */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.slot{background:var(--mint);padding:16px 10px;border-radius:12px}
.slot small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.slot b{display:block;font-family:"EB Garamond",serif;font-size:26px;font-weight:500;margin-top:4px}

/* ═══ 5 đếm ngược + lịch ═══ */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px;margin:0 auto}
.cd div{background:var(--mint);padding:14px 4px;border-radius:12px}
.cd b{display:block;font-family:"EB Garamond",serif;font-size:28px;font-weight:500;line-height:1}
.cd small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.cal{max-width:300px;margin:22px auto 0}
.cal table{width:100%;border-collapse:collapse;font-size:13px}
.cal th{font-size:10px;letter-spacing:.06em;color:var(--leaf);font-weight:500;padding-bottom:10px}
.cal td{padding:5px 0;color:var(--soft);font-weight:400;height:32px}
.cal td.d{color:var(--ink)}
.cal td.mk{position:relative;color:var(--paper);font-weight:500}
.cal td.mk span{position:relative;z-index:2}
.cal td.mk::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:26px;height:26px;border-radius:50%;background:var(--ink);z-index:1}
.cal caption{caption-side:bottom;padding-top:14px;font-family:"EB Garamond",serif;
  font-style:italic;font-size:14px;color:var(--soft)}
.acts{margin-top:20px;display:flex;flex-direction:column;gap:11px;align-items:center}
.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);background:none;
  padding:12px 26px;border-radius:999px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  transition:background .3s,border-color .3s}
.btn:hover{background:var(--mint);border-color:var(--ink)}
.btn.fill{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.fill:hover{background:var(--ink-deep)}

/* ═══ 6 bản đồ ═══ */
.addr{font-size:13.5px;line-height:1.7;color:var(--soft);max-width:32ch;margin:0 auto}
.map{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  height:240px;background:var(--mint-2)}
.map iframe{width:100%;height:100%;border:0;display:block}

/* ═══ 7 lịch trình ═══ */
.tl{max-width:320px;margin:0 auto;text-align:left;position:relative}
.tl::before{content:"";position:absolute;left:53px;top:12px;bottom:12px;width:1px;background:var(--line)}
.tl .it{display:flex;gap:16px;align-items:baseline;padding:13px 0;position:relative}
.tl .tm{width:46px;flex:none;text-align:right;font-family:"EB Garamond",serif;font-size:16px}
.tl .dot{width:15px;flex:none;display:flex;justify-content:center;position:relative;z-index:2}
.tl .dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--paper);
  border:1px solid var(--ink);margin-top:8px}
.tl .lb{font-size:13.5px}

#dock{position:fixed;bottom:18px;right:18px;z-index:70;display:none;align-items:center;justify-content:center;
  width:54px;height:54px;background:var(--ink);color:var(--paper);border:0;border-radius:50%;
  box-shadow:0 10px 26px -8px rgba(12,58,32,.6)}
#dock.on{display:flex}
#dock svg{width:22px;height:22px;flex:none}
#dock.sp svg{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#dock span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═══ 9 sổ lưu bút ═══ */
.wform{max-width:330px;margin:0 auto;text-align:left;display:grid;gap:9px}
.wform input,.wform textarea{width:100%;font:inherit;font-size:13.5px;color:var(--ink);
  background:var(--mint);border:1px solid transparent;border-radius:10px;padding:11px 13px;resize:vertical}
.wform input:focus,.wform textarea:focus{border-color:var(--line);outline:none}
.wform textarea{min-height:86px}
.wform .btn{justify-self:start;margin-top:2px}
.wall{max-width:330px;margin:20px auto 0;text-align:left;display:grid;gap:8px}
.wish{background:var(--mint);padding:14px 15px;border-radius:12px}
.wish b{font-family:"EB Garamond",serif;font-size:15px;font-weight:600}
.wish p{font-size:13px;color:var(--soft);margin-top:3px;white-space:pre-wrap;line-height:1.55}
.empty{font-size:12.5px;font-style:italic;color:var(--soft)}

/* ═══ kết ═══ */
.thanks{position:relative;z-index:2;font-family:"Dancing Script",cursive;font-size:25px;line-height:1.5;max-width:22ch;margin:0 auto}
.foot{padding:0 26px 36px;text-align:center;font-size:11.5px;color:var(--soft)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .rv,.gal button{opacity:1;transform:none}
}
</style>
</head>
<body>

<button id="cover">
  <div class="cv-panel l"><svg><use href="#sprig"/></svg></div>
  <div class="cv-panel r"><svg><use href="#sprig"/></svg></div>
  <div class="leaves" id="leaves" aria-hidden="true"></div>
  <div class="cv-face">
    <h1 class="cv-names" id="cvNames"></h1>
    <p class="cv-date" id="cvDate"></p>
    <div class="cv-seal"><b id="cvSeal"></b></div>
    <p class="cv-lead">Thân mời</p>
    <p class="cv-guest" id="cvGuest"></p>
    <span class="cv-cta">Mở thiệp</span>
    <span class="cv-cue">Chạm để mở thiệp</span>
  </div>
</button>

<main class="sheet" id="sheet"></main>

<button id="dock" aria-label="Điều khiển nhạc">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>
  <span id="dockName"></span>

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++}else q=false } else f+=c }
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}
    else if(c!=="\r")f+=c;}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
const norm=s=>s.trim().toLowerCase().normalize("NFD")
  .replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/\s+/g,"_");

async function readSheet(id,name){
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  const rows=parseCSV(await r.text()).filter(x=>x.some(c=>c.trim()));
  if(!rows.length) return [];
  const head=rows[0].map(norm);
  return rows.slice(1).map(r2=>Object.fromEntries(head.map((h,i)=>[h,(r2[i]||"").trim()])));
}

  let b="";for(let i=0;i<c.length;i+=7)b+=`<tr>${c.slice(i,i+7).join("")}</tr>`;

    ["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<th>${x}</th>`).join("")

function spawnLeaves(n=16){
  const wrap=$("#leaves"); if(!wrap) return;

  }

}
function scheduleAutoScroll(delay=1500){
  let cancelled=false;
  const evs=["wheel","touchstart","pointerdown","keydown"];
  const cancel=()=>{ cancelled=true; evs.forEach(ev=>removeEventListener(ev,cancel)); };
  evs.forEach(ev=>addEventListener(ev,cancel,{passive:true,once:true}));
  setTimeout(()=>{
    evs.forEach(ev=>removeEventListener(ev,cancel));
    if(!cancelled) autoScrollToEnd();
  },delay);
}
function autoScrollToEnd(){
  const endY=document.documentElement.scrollHeight-innerHeight, startY=scrollY, dist=endY-startY;
  if(dist<=40) return;
  const duration=Math.min(40000,Math.max(15000,dist/90*1000));
  let cancelled=false;
  const html=document.documentElement;
  const prevBehavior=html.style.scrollBehavior;
  html.style.scrollBehavior="auto";
  const finish=()=>{ html.style.scrollBehavior=prevBehavior; evs.forEach(ev=>removeEventListener(ev,cancel)); };
  const cancel=()=>{ cancelled=true; finish(); };
  const evs=["wheel","touchstart","pointerdown","keydown"];
  evs.forEach(ev=>addEventListener(ev,cancel,{passive:true,once:true}));
  const t0=performance.now();
  (function step(now){
    if(cancelled) return;
    const t=Math.min(1,(now-t0)/duration);
    scrollTo(0,startY+dist*t);
    if(t<1) requestAnimationFrame(step); else finish();
  })(t0);
}
function reveals(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}
  }),{threshold:.1});
  document.querySelectorAll(".rv,.gal button").forEach(el=>io.observe(el));
}
function countdown(){
  const el=$("#cd").children;
  (function tick(){
    let s=Math.max(0,Math.floor((D-new Date())/1000));
    const d=Math.floor(s/86400); s-=d*86400;
    const h=Math.floor(s/3600);  s-=h*3600;
    const m=Math.floor(s/60);    s-=m*60;
    [d,h,m,s].forEach((v,i)=>el[i].firstElementChild.textContent=pad(v));
    setTimeout(tick,1000);
  })();
}

  const p=pics(); if(!p.length) return;
  li=Math.min(i,p.length-1);
  $("#lbT").innerHTML=p.map((s,k)=>`<img src="${esc(s)}" data-k="${k}" alt="">`).join("");
  $("#lb").classList.add("on"); document.body.style.overflow="hidden"; paintLB();
  preloadPics();
}
function paintLB(){
  const p=pics();
  $("#lbImg").src=p[li];
  $("#lbCnt").textContent=`${li+1} / ${p.length}`;
  $("#lbT").querySelectorAll("img").forEach((t,k)=>t.classList.toggle("on",k===li));
}
function moveLB(d){ const p=pics(); li=(li+d+p.length)%p.length; paintLB(); }
function closeLB(){ $("#lb").classList.remove("on"); document.body.style.overflow=""; }

/* --- nhạc --- */
const audio=new Audio(); audio.preload="none";
let cur=-1;
function playTrack(i){
  const t=CONFIG.music[i]; if(!t||!t.src) return;
  if(i===cur&&!audio.paused){ audio.pause(); return; }
  if(i!==cur){ cur=i; audio.src=t.src; }
  audio.play().catch(()=>{});
}
function paintPlayer(){
  const t=CONFIG.music[cur], dk=$("#dock");
  if(!t){ dk.classList.remove("on","sp"); return; }
  dk.classList.add("on");
  dk.classList.toggle("sp",!audio.paused);
  $("#dockName").textContent=audio.paused?t.title+" — tạm dừng":t.title;
}
audio.addEventListener("play",paintPlayer);
audio.addEventListener("pause",paintPlayer);
audio.addEventListener("ended",()=>{
  const n=CONFIG.music.findIndex((t,i)=>i>cur&&t.src);
  if(n>-1) playTrack(n); else { cur=-1; paintPlayer(); }
});

/* --- sổ lưu bút --- */
function paintWishes(list){
  const w=$("#wall");
  if(!list.length){ w.innerHTML=`<p class="empty">Chưa có lời chúc nào. Hãy là người đầu tiên!</p>`; return; }
  w.innerHTML=list.slice().reverse().map(x=>
    `<div class="wish"><b>${esc(x.name)}</b><p>${esc(x.msg)}</p></div>`).join("");
}
function wishesFromGuests(guests){
  return guests.map(g=>({
    name:[g.xung_ho,g.ten].filter(Boolean).join(" ")||"Ẩn danh",
    msg:(g.loi_chuc_tu_khach||"").trim()
  })).filter(x=>x.msg);
}
function sendWish(){
  const gb=CONFIG.guestbook;
  const name=$("#wName").value.trim(), msg=$("#wMsg").value.trim();
  const btn=$("#wSend");
  if(!msg){ $("#wMsg").focus(); return; }
  if(!guestCode){ btn.textContent="Cần mở bằng link mời riêng"; setTimeout(()=>btn.textContent="Gửi lời chúc",2600); return; }
  if(!gb.scriptUrl){ btn.textContent="Chưa cấu hình"; setTimeout(()=>btn.textContent="Gửi lời chúc",2200); return; }
  fetch(gb.scriptUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({ma:guestCode,loi_chuc:msg})}).catch(()=>{});
  const w=$("#wall");
  if(w.querySelector(".empty")) w.innerHTML="";
  w.insertAdjacentHTML("afterbegin",
    `<div class="wish"><b>${esc(name||"Ẩn danh")}</b><p>${esc(msg)}</p></div>`);
  $("#wMsg").value="";
  btn.textContent="Đã gửi ✓"; setTimeout(()=>btn.textContent="Gửi lời chúc",2200);
}

/* ══════════════════════════════════════════════════════════════════
   ⑤ BẢNG TẠO LINK MỜI  →  thêm ?admin=1 vào cuối địa chỉ
   ══════════════════════════════════════════════════════════════════ */
function adminPanel(guests,err){
  $("#cover").remove(); $("#dock").remove();
  const base=location.origin+location.pathname;
  const th="text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--leaf);font-weight:400";
  const td="padding:9px 8px;border-bottom:1px solid var(--hair)";
  $("#sheet").style.maxWidth="860px";
  $("#sheet").innerHTML=`<div style="padding:36px 26px">
    <h1 class="serif" style="font-size:26px;font-weight:500">Danh sách link mời</h1>
    <p style="font-size:12.5px;color:var(--soft);margin:4px 0 20px">${
      err?"⚠ "+esc(err):(CONFIG.SHEET_ID?guests.length+" khách, đọc từ Google Sheet.":"Chưa nối sheet — dữ liệu mẫu.")}</p>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr><th style="${th}">Khách</th><th style="${th}">Link riêng</th><th style="${th}"></th></tr></thead>
      <tbody>${guests.map(g=>{
        const l=base+"?"+CONFIG.PARAM+"="+encodeURIComponent(g.ma||"");
        return `<tr><td style="${td}">${esc([g.xung_ho,g.ten].filter(Boolean).join(" "))}</td>
          <td style="${td};font-size:11.5px;color:var(--soft);word-break:break-all">${esc(l)}</td>
          <td style="${td}"><button data-link="${esc(l)}" class="btn" style="padding:6px 12px;letter-spacing:.1em">Chép</button></td></tr>`;
      }).join("")}</tbody></table></div>`;
  document.querySelectorAll("button[data-link]").forEach(b=>b.onclick=()=>{
    navigator.clipboard.writeText(b.dataset.link);
    const t=b.textContent;b.textContent="Đã chép ✓";setTimeout(()=>b.textContent=t,1400);
  });
}

/* ══════════════════════════════════════════════════════════════════
   ⑥ CHẠY
   ══════════════════════════════════════════════════════════════════ */
(async function(){
  const qs=new URLSearchParams(location.search);
  const code=(qs.get(CONFIG.PARAM)||"").trim().toLowerCase();

  let guests=[],err=null;
  try{ guests=CONFIG.SHEET_ID?await readSheet(CONFIG.SHEET_ID,CONFIG.SHEET_NAME):DEMO; }
  catch(e){ err="Không đọc được sheet ("+e.message+"). Kiểm tra quyền chia sẻ."; guests=DEMO; }

  if(qs.has("admin")){ adminPanel(guests,err); return; }

  $("#cvNames").innerHTML=`${esc(CONFIG.groom.short)}<span class="cv-amp">&amp;</span>${esc(CONFIG.bride.short)}`;
  $("#cvDate").textContent=`${pad(D.getDate())} tháng ${D.getMonth()+1}, ${D.getFullYear()}`;
  const callInitial=s=>{const p=s.trim().split(/\s+/);return p[p.length-1][0];};
  $("#cvSeal").innerHTML=`${esc(callInitial(CONFIG.groom.short))}<span class="amp">&amp;</span>${esc(callInitial(CONFIG.bride.short))}`;

  build();
  showGuest(code?guests.find(g=>(g.ma||"").trim().toLowerCase()===code):null);
  spawnLeaves();
  reveals(); countdown();
  document.body.style.overflow="hidden";

  document.querySelectorAll(".gal button").forEach(b=>b.onclick=()=>openLB(+b.dataset.i));
  $("#lbX").onclick=closeLB; $("#lbP").onclick=()=>moveLB(-1); $("#lbN").onclick=()=>moveLB(1);
  $("#lbT").onclick=e=>{ if(e.target.dataset.k!==undefined){ li=+e.target.dataset.k; paintLB(); } };
  $("#dock").onclick=()=>audio.paused?audio.play().catch(()=>{}):audio.pause();
  $("#wSend").onclick=sendWish;
  document.addEventListener("keydown",e=>{
    if(!$("#lb").classList.contains("on")) return;
    if(e.key==="Escape")closeLB(); if(e.key==="ArrowLeft")moveLB(-1); if(e.key==="ArrowRight")moveLB(1);
  });

  paintWishes(wishesFromGuests(guests));

  $("#cover").addEventListener("click",()=>{
    $("#cover").classList.add("open");
    document.body.style.overflow="";
    if(CONFIG.autoplay){ const f=CONFIG.music.findIndex(t=>t.src); if(f>-1) playTrack(f); }
    setTimeout(()=>{
      $("#cover").remove();
      scheduleAutoScroll();
    },900);
  },{once:true});
})();
</script>
</body>
</html>
